[pytest]
# Las pruebas viven en `tests/` y se corren desde la raíz del proyecto:
#
#     python -m pytest              # todas
#     python -m pytest -v           # una línea por prueba, para la evidencia
#     python -m pytest tests/test_permisos.py    # solo la matriz de permisos
#
# Necesitan MySQL arriba (XAMPP) y la base `mediapp` existente, porque el
# esquema de `mediapp_test` se clona de ella. Nunca escriben en `mediapp`.
testpaths = tests
python_files = test_*.py
addopts = --strict-markers
