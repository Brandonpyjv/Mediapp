{% extends "base.html" %}
{% block title %}Crear Paciente - MediApp{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center mb-4">
	<div>
		<h3 class="m-0"><strong>Crear Nuevo Paciente</strong></h3>
		<span class="text-muted">Registre un nuevo paciente en el sistema</span>
	</div>
	<a href="/paMC" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
</div>

<div class="card shadow-sm border-0 rounded-4">
	<div class="card-body p-4">
		{% if error %}
		<div class="alert alert-danger alert-dismissible fade show">
			<i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		{% endif %}

		<form action="/addPA" method="POST">
			<div class="mb-3">
				<label class="form-label fw-bold">Nombre Completo</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-person"></i></span>
					<input type="text" name="nombre" class="form-control"
						value="{{ v_nombre if v_nombre else '' }}" required
						oninput="this.value = this.value.replace(/[0-9]/g, '')">
				</div>
			</div>

			<div class="row">
				<div class="col-md-5 mb-3">
					<label class="form-label fw-bold">Tipo de Documento</label>
					<select name="tipo_documento" class="form-select" required>
						<option value="" disabled {{ 'selected' if not v_tipo_doc else '' }}>Seleccionar...</option>
						<option value="RC" {{ 'selected' if v_tipo_doc=='RC' else '' }}>Registro Civil</option>
						<option value="CC" {{ 'selected' if v_tipo_doc=='CC' else '' }}>Cédula de Ciudadanía</option>
						<option value="TI" {{ 'selected' if v_tipo_doc=='TI' else '' }}>Tarjeta de Identidad</option>
						<option value="CE" {{ 'selected' if v_tipo_doc=='CE' else '' }}>Cédula de Extranjería</option>
						<option value="PAS" {{ 'selected' if v_tipo_doc=='PAS' else '' }}>Pasaporte</option>
					</select>
				</div>
				<div class="col-md-7 mb-3">
					<label class="form-label fw-bold">Número de Documento</label>
					<div class="input-group">
						<span class="input-group-text"><i class="bi bi-credit-card"></i></span>
						<input type="text" name="numero_documento" class="form-control"
							value="{{ v_num_doc if v_num_doc else '' }}" required
							oninput="this.value = this.value.replace(/[^0-9]/g, '')">
					</div>
				</div>
			</div>

			<div class="mb-3">
				<label class="form-label fw-bold">Fecha de Nacimiento</label>
				<input type="date" name="fecha_nacimiento" class="form-control"
					value="{{ v_fecha_nac if v_fecha_nac else '' }}" required>
			</div>

			<div class="row">
				<div class="col-md-6 mb-3">
					<label class="form-label fw-bold">Teléfono</label>
					<input type="text" name="telefono" class="form-control" maxlength="10"
						value="{{ v_tel if v_tel else '' }}" required
						oninput="this.value = this.value.replace(/[^0-9]/g, '')">
				</div>
				<div class="col-md-6 mb-3">
					<label class="form-label fw-bold">Correo Electrónico</label>
					<input type="email" name="email" class="form-control"
						pattern="[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}"
						title="Correo con formato usuario@dominio.tld"
						value="{{ v_email if v_email else '' }}" required>
				</div>
			</div>

			<div class="row">
				<div class="col-md-6 mb-3">
					<label class="form-label fw-bold">Dirección</label>
					<div class="input-group">
						<span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
						<input type="text" name="direccion" class="form-control"
							value="{{ v_dir if v_dir else '' }}" required>
					</div>
				</div>
				<div class="col-md-6 mb-3">
					<label class="form-label fw-bold">Vincular a Usuario del Sistema (Opcional)</label>
					<div class="input-group">
						<span class="input-group-text"><i class="bi bi-person-badge"></i></span>
						<select name="id_usuario" class="form-select">
							<option value="">-- Sin usuario vinculado --</option>
							{% for u in usuarios %}
							<option value="{{ u.id_usuario }}" {{ 'selected' if v_id_usuario == (u.id_usuario|string) else '' }}>{{ u.username }}</option>
							{% endfor %}
						</select>
					</div>
				</div>
			</div>

			<div class="d-flex justify-content-end mt-4 gap-2">
				<a href="/paMC" class="btn btn-outline-secondary px-4">Cancelar</a>
				<button type="submit" class="btn btn-primary px-4">
					<i class="bi bi-person-check me-1"></i> Crear Paciente
				</button>
			</div>
		</form>
	</div>
</div>

<script>
	// --- Validación de fecha de nacimiento (no puede ser futura, zona horaria Colombia) ---
	function getColombiaTodayStr() {
		const parts = new Intl.DateTimeFormat('en-CA', {
			timeZone: 'America/Bogota', year: 'numeric', month: '2-digit', day: '2-digit'
		}).formatToParts(new Date());
		const map = {};
		parts.forEach(p => map[p.type] = p.value);
		return map.year + '-' + map.month + '-' + map.day;
	}

	const fechaNacInput = document.querySelector('input[name="fecha_nacimiento"]');
	const todayColombiaStrPA = getColombiaTodayStr();
	fechaNacInput.max = todayColombiaStrPA;

	fechaNacInput.closest('form').addEventListener('submit', function (e) {
		if (!fechaNacInput.value) return;
		if (fechaNacInput.value > todayColombiaStrPA) {
			e.preventDefault();
			alert('Fecha no válida. La fecha de nacimiento no puede ser una fecha futura.');
			fechaNacInput.focus();
		}
	});
</script>
{% endblock %}
