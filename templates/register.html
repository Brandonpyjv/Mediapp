<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediApp | Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}?v=2" type="image/x-icon">
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="login-container" style="display: flex; flex-direction: column;">
                    <!-- HEADER -->
                    <div style="background: linear-gradient(160deg, #1e2a4a, #3b4d85, #667eea); color: white; padding: 30px 40px; text-align: center;">
                        <i class="bi bi-hospital" style="font-size: 40px;"></i>
                        <h2 class="mt-2"><strong>MediApp Registration</strong></h2>
                        <p class="mb-0 text-white-50">Create your account and patient profile to access the system.</p>
                    </div>

                    <!-- FORM PANEL -->
                    <div class="login-form">
                        {% if error %}
                        <div class="alert alert-danger text-center"><i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}</div>
                        {% endif %}

                        <form action="{{ url_for('register') }}" method="POST">
                            
                            <h5 class="mb-3 text-primary border-bottom pb-2"><i class="bi bi-person-vcard me-2"></i>Patient Details</h5>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" name="nombre" class="form-control" placeholder="Enter your full name"
                                        value="{{ v_nombre if v_nombre else '' }}" required
                                        oninput="this.value = this.value.replace(/[0-9]/g, '')">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-5 mb-3">
                                    <label class="form-label fw-bold">Document Type</label>
                                    <select name="tipo_documento" class="form-select" required>
                                        <option value="" disabled {{ 'selected' if not v_tipo_doc else '' }}>Select...</option>
                                        <option value="RC" {{ 'selected' if v_tipo_doc=='RC' else '' }}>Civil Registry</option>
                                        <option value="CC" {{ 'selected' if v_tipo_doc=='CC' else '' }}>Citizenship ID</option>
                                        <option value="TI" {{ 'selected' if v_tipo_doc=='TI' else '' }}>Identity Card</option>
                                        <option value="CE" {{ 'selected' if v_tipo_doc=='CE' else '' }}>Foreigner ID</option>
                                        <option value="PAS" {{ 'selected' if v_tipo_doc=='PAS' else '' }}>Passport</option>
                                    </select>
                                </div>
                                <div class="col-md-7 mb-3">
                                    <label class="form-label fw-bold">Document Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-credit-card"></i></span>
                                        <input type="text" name="numero_documento" class="form-control" placeholder="Document ID"
                                            value="{{ v_num_doc if v_num_doc else '' }}" required
                                            oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Date of Birth</label>
                                <input type="date" name="fecha_nacimiento" class="form-control"
                                    value="{{ v_fecha_nac if v_fecha_nac else '' }}" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Phone Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                        <input type="text" name="telefono" class="form-control" maxlength="10" placeholder="10 digits"
                                            value="{{ v_tel if v_tel else '' }}" required
                                            oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" name="email" class="form-control" placeholder="example@email.com"
                                            value="{{ v_email if v_email else '' }}" required>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Home Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                                    <input type="text" name="direccion" class="form-control" placeholder="Full address"
                                        value="{{ v_dir if v_dir else '' }}" required>
                                </div>
                            </div>

                            <h5 class="mb-3 mt-4 text-primary border-bottom pb-2"><i class="bi bi-shield-lock me-2"></i>Account Details</h5>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Username</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                                        <input type="text" name="username" class="form-control" placeholder="Choose a username" 
                                               value="{{ v_user if v_user else '' }}" required>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                        <input type="password" name="password" id="password" class="form-control" placeholder="Create password" required>
                                        <button type="button" class="btn btn-outline-secondary" onclick="togglePassword()">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid mt-4">
                                <button class="btn btn-primary btn-lg">
                                    <i class="bi bi-person-plus-fill me-2"></i> Complete Registration
                                </button>
                            </div>
                        </form>

                        <div class="text-center mt-3 mb-2">
                            <span class="text-muted" style="font-size: 0.9rem;">
                                Already have an account? <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold" style="color: #667eea;">Sign In here</a>
                            </span>
                        </div>

                        <hr>
                        <div class="text-center footer-text">
                            &copy; 2026 MediApp &middot; Intelligent Clinical System
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById("password");
            input.type = input.type === "password" ? "text" : "password";
        }

        // --- Validación de fecha de nacimiento (no puede ser futura, zona horaria Colombia) ---
        function getColombiaTodayStr() {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'America/Bogota', year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date());
            const map = {};
            parts.forEach(p => map[p.type] = p.value);
            return map.year + '-' + map.month + '-' + map.day;
        }

        const fechaNacInput = document.querySelector('input[name="fecha_nacimiento"]');
        const todayColombiaStrReg = getColombiaTodayStr();
        fechaNacInput.max = todayColombiaStrReg;

        fechaNacInput.closest('form').addEventListener('submit', function (e) {
            if (!fechaNacInput.value) return;
            if (fechaNacInput.value > todayColombiaStrReg) {
                e.preventDefault();
                alert('Fecha no válida. La fecha de nacimiento no puede ser una fecha futura.');
                fechaNacInput.focus();
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
