{% extends "base.html" %}
{% block title %}Editar Cita - MediApp{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center mb-4">
	<div>
		<h3 class="m-0"><strong>Editar Cita</strong></h3>
		<span class="text-muted">Actualice los datos de la reserva</span>
	</div>
	<a href="/ciMC" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
</div>

<div class="card shadow-sm border-0 rounded-4">
	<div class="card-body p-4">
		{% if error %}
		<div class="alert alert-danger alert-dismissible fade show">
			<i class="bi bi-exclamation-octagon-fill me-2"></i> {{ error }}
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		{% endif %}

		<form method="POST">
			<div class="row">
				<div class="col-md-6 mb-3">
					<label class="form-label fw-bold">Paciente</label>
					<select name="id_paciente" class="form-select" required>
						<option value="" disabled>-- Seleccionar paciente --</option>
						{% for p in pacientes %}
						<option value="{{ p.id_paciente }}" {% if p.id_paciente==user.id_paciente %}selected{% endif %}>
							{{ p.nombre }}
						</option>
						{% endfor %}
					</select>
				</div>

				<div class="col-md-6 mb-3">
					<label class="form-label fw-bold">Médico</label>
					<select name="id_medico" class="form-select" required>
						<option value="" disabled>-- Seleccionar médico --</option>
						{% for m in medicos %}
						<option value="{{ m.id_medico }}" {% if m.id_medico==user.id_medico %}selected{% endif %}>
							Dr. {{ m.nombre }}
						</option>
						{% endfor %}
					</select>
				</div>
			</div>

			<div class="mb-3">
				<label class="form-label fw-bold">Fecha y Hora</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
					<input type="datetime-local" name="fecha" class="form-control" value="{{ user.fecha }}" required>
				</div>
			</div>

			<div class="mb-4">
				<label class="form-label fw-bold">Motivo de la Visita</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-chat-dots"></i></span>
					<textarea name="motivo" class="form-control" rows="3">{{ user.motivo }}</textarea>
				</div>
			</div>

			<div class="d-flex justify-content-end mt-4 gap-2">
				<a href="/ciMC" class="btn btn-outline-secondary px-4">Cancelar</a>
				<button type="submit" class="btn btn-primary px-4">
					<i class="bi bi-save me-1"></i> Guardar Cambios
				</button>
			</div>
		</form>
	</div>
</div>

<script>
	// --- Validación de fecha de la cita (no anteriores a hoy, zona horaria Colombia) ---
	function getColombiaTodayStr() {
		const parts = new Intl.DateTimeFormat('en-CA', {
			timeZone: 'America/Bogota', year: 'numeric', month: '2-digit', day: '2-digit'
		}).formatToParts(new Date());
		const map = {};
		parts.forEach(p => map[p.type] = p.value);
		return map.year + '-' + map.month + '-' + map.day;
	}

	const fechaCitaInput = document.querySelector('input[name="fecha"]');
	const todayColombiaStr = getColombiaTodayStr();
	fechaCitaInput.min = todayColombiaStr + 'T00:00';

	fechaCitaInput.closest('form').addEventListener('submit', function (e) {
		if (!fechaCitaInput.value) return;
		const fechaSeleccionada = fechaCitaInput.value.split('T')[0];
		if (fechaSeleccionada < todayColombiaStr) {
			e.preventDefault();
			alert('Fecha no válida. No se pueden registrar citas en fechas anteriores a la fecha actual.');
			fechaCitaInput.focus();
		}
	});
</script>
{% endblock %}
