{% extends "base.html" %}
{% block title %}Check Availability - MediApp{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center mb-4">
	<div>
		<h3 class="m-0"><strong>Doctor Availability</strong></h3>
		<span class="text-muted">Check a doctor's booked times before requesting an appointment</span>
	</div>
	<a href="/ciMC" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Return</a>
</div>

<div class="card shadow-sm border-0 rounded-4">
	<div class="card-body p-4">
		<div class="row g-3 align-items-end mb-3">
			<div class="col-md-6">
				<label class="form-label fw-bold">Doctor</label>
				<select id="s_med" class="form-select">
					<option value="" disabled selected>-- Choose Doctor --</option>
					{% for m in medicos %}
					<option value="{{ m.id_medico }}">Dr. {{ m.nombre }}</option>
					{% endfor %}
				</select>
			</div>
			<div class="col-md-4">
				<label class="form-label fw-bold">Date</label>
				<input type="date" id="f_date" class="form-control">
			</div>
			<div class="col-md-2">
				<button id="btnCheck" class="btn btn-primary w-100"><i class="bi bi-search me-1"></i>Check</button>
			</div>
		</div>

		<div class="alert alert-info d-flex align-items-center mb-3">
			<i class="bi bi-info-circle-fill me-2"></i>
			Appointments for the same doctor must be at least {{ minutos }} minutes apart.
		</div>

		<div id="resultado"></div>
	</div>
</div>

<script>
	document.getElementById("btnCheck").addEventListener("click", function () {
		const idMed = document.getElementById("s_med").value;
		const fecha = document.getElementById("f_date").value;
		const box = document.getElementById("resultado");

		if (!idMed || !fecha) {
			box.innerHTML = '<div class="alert alert-warning">Select a doctor and a date first.</div>';
			return;
		}

		box.innerHTML = '<div class="text-center py-3"><div class="spinner-border text-primary"></div></div>';

		fetch('/api/disponibilidad/' + idMed + '?fecha=' + fecha)
			.then(r => r.json())
			.then(d => {
				if (d.error) {
					box.innerHTML = '<div class="alert alert-danger">' + d.error + '</div>';
					return;
				}
				if (d.ocupados.length === 0) {
					box.innerHTML = '<div class="alert alert-success"><i class="bi bi-check-circle-fill me-1"></i>No appointments booked yet for this doctor on this date.</div>';
					return;
				}
				let html = '<h6 class="fw-bold mb-2">Booked times on ' + d.fecha + ':</h6>';
				html += '<div class="d-flex flex-wrap gap-2">';
				d.ocupados.forEach(h => {
					html += '<span class="badge bg-danger-subtle text-danger border border-danger-subtle px-3 py-2"><i class="bi bi-clock-fill me-1"></i>' + h + '</span>';
				});
				html += '</div>';
				html += '<small class="text-muted d-block mt-3">Any other time is available, as long as it keeps at least ' + d.minutos_entre_citas + ' minutes of separation from the times above.</small>';
				box.innerHTML = html;
			})
			.catch(() => {
				box.innerHTML = '<div class="alert alert-danger">Connection error. Please try again.</div>';
			});
	});
</script>
{% endblock %}
