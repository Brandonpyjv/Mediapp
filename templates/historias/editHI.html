{% extends "base.html" %}
{% block title %}Edit Medical History - MediApp{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center mb-4">
	<div>
		<h3 class="m-0"><strong>Edit Clinical Record</strong></h3>
		<span class="text-muted">Update patient medical history details</span>
	</div>
	<a href="/hiMC" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Return</a>
</div>

<div class="card shadow-sm border-0 rounded-4">
	<div class="card-body p-4">
		{% if error %}
		<div class="alert alert-danger alert-dismissible fade show">
			<i class="bi bi-exclamation-octagon-fill me-2"></i> {{ error }}
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		{% endif %}

		<form method="POST">
			<div class="mb-3">
				<label class="form-label fw-bold">Patient</label>
				<select name="id_paciente" class="form-select" required>
					<option value="" disabled>-- Choose Patient --</option>
					{% for p in pacientes %}
					<option value="{{ p.id_paciente }}" {% if p.id_paciente==user.id_paciente %}selected{% endif %}>
						{{ p.nombre }}
					</option>
					{% endfor %}
				</select>
			</div>

			<div class="mb-3">
				<label class="form-label fw-bold">Record Date</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-calendar-check"></i></span>
					<input type="datetime-local" name="fecha" class="form-control" value="{{ user.fecha }}" required>
				</div>
			</div>

			<div class="mb-3">
				<label class="form-label fw-bold">Clinical Description</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-file-earmark-medical"></i></span>
					<textarea name="descripcion" class="form-control" rows="3" required>{{ user.descripcion }}</textarea>
				</div>
			</div>

			<div class="mb-4">
				<label class="form-label fw-bold text-secondary">Notes (Optional)</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-journal-text"></i></span>
					<textarea name="notas" class="form-control" rows="2">{{ user.notas }}</textarea>
				</div>
			</div>

			<div class="d-flex justify-content-end mt-4 gap-2">
				<a href="/hiMC" class="btn btn-outline-secondary px-4">Cancel</a>
				<button type="submit" class="btn btn-primary px-4">
					<i class="bi bi-save me-1"></i> Save Changes
				</button>
			</div>
		</form>
	</div>
</div>
{% endblock %}
