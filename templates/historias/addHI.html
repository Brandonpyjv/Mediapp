{% extends "base.html" %}
{% block title %}Add Medical History - MediApp{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center mb-4">
	<div>
		<h3 class="m-0"><strong>Create Clinical Record</strong></h3>
		<span class="text-muted">Register historical medical data for a patient</span>
	</div>
	<a href="/hiMC" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Return</a>
</div>

<div class="card shadow-sm border-0 rounded-4">
	<div class="card-body p-4">
		{% if error %}
		<div class="alert alert-danger alert-dismissible fade show">
			<i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		{% endif %}

		<form action="{{ url_for('addHI') }}" method="POST">
			<div class="row">
				<div class="col-md-6 mb-3">
					<div class="bg-light p-3 rounded-3 border">
						<label class="form-label text-primary fw-bold mb-2"><i class="bi bi-search"></i> Select Patient</label>
						<input type="text" id="f_pac" class="form-control mb-2" placeholder="Filter patient...">
						<select name="id_paciente" id="s_pac" class="form-select" required size="4">
							{% for p in pacientes %}
							<option value="{{ p.id_paciente }}" {{ 'selected' if v_id_pac|string == p.id_paciente|string else '' }}>
								{{ p.nombre }}
							</option>
							{% endfor %}
						</select>
					</div>
				</div>

				<div class="col-md-6 mb-3">
					<div class="bg-light p-3 rounded-3 border">
						<label class="form-label text-primary fw-bold mb-2"><i class="bi bi-search"></i> Select Doctor</label>
						<input type="text" id="f_med" class="form-control mb-2" placeholder="Filter doctor...">
						<select name="id_medico" id="s_med" class="form-select" required size="4">
							{% for m in medicos %}
							<option value="{{ m.id_medico }}" {{ 'selected' if v_id_med|string == m.id_medico|string else '' }}>
								Dr. {{ m.nombre }}
							</option>
							{% endfor %}
						</select>
					</div>
				</div>
			</div>

			<div class="mb-3">
				<label class="form-label fw-bold">Record Date</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-calendar-check"></i></span>
					<input type="datetime-local" name="fecha" class="form-control" 
						value="{{ v_fecha if v_fecha else '' }}" required>
				</div>
			</div>

			<div class="mb-3">
				<label class="form-label fw-bold">Clinical Description</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-file-earmark-medical"></i></span>
					<textarea name="descripcion" class="form-control" rows="3"
						placeholder="Symptoms, diagnosis details..." required>{{ v_desc if v_desc else '' }}</textarea>
				</div>
			</div>

			<div class="mb-4">
				<label class="form-label fw-bold text-secondary">Notes (Optional)</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-journal-text"></i></span>
					<textarea name="notas" class="form-control" rows="2"
						placeholder="Extra observations...">{{ v_notas if v_notas else '' }}</textarea>
				</div>
			</div>

			<div class="d-flex justify-content-end mt-4 gap-2">
				<a href="/hiMC" class="btn btn-outline-secondary px-4">Cancel</a>
				<button type="submit" class="btn btn-primary px-4">
					<i class="bi bi-save me-1"></i> Save Medical History
				</button>
			</div>
		</form>
	</div>
</div>

<script>
	function setupFilter(inputId, selectId) {
		document.getElementById(inputId).addEventListener("keyup", function () {
			let val = this.value.toLowerCase();
			let options = document.querySelectorAll("#" + selectId + " option");
			options.forEach(o => {
				o.style.display = o.textContent.toLowerCase().includes(val) ? "block" : "none";
			});
		});
	}
	setupFilter("f_pac", "s_pac");
	setupFilter("f_med", "s_med");
</script>
{% endblock %}
