{% extends "base.html" %}
{% block title %}Add Specialty - MediApp{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center mb-4">
	<div>
		<h3 class="m-0"><strong>Add Specialty</strong></h3>
		<span class="text-muted">Register a new medical area</span>
	</div>
	<a href="/esMC" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Return</a>
</div>

<div class="card shadow-sm border-0 rounded-4">
	<div class="card-body p-4">
		{% if error %}
		<div class="alert alert-danger alert-dismissible fade show">
			<i class="bi bi-exclamation-octagon-fill me-2"></i> {{ error }}
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		{% endif %}

		<form action="/addES" method="POST">
			<div class="mb-3">
				<label class="form-label fw-bold">Specialty Name</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-star"></i></span>
					<input type="text" name="nombre" class="form-control" placeholder="e.g. Cardiology"
						value="{{ v_nombre if v_nombre else '' }}" required
						oninput="this.value = this.value.replace(/[0-9]/g, '')">
				</div>
				<div class="form-text">Minimum 4 characters. Numbers are not allowed.</div>
			</div>

			<div class="mb-4">
				<label class="form-label fw-bold">Description</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-card-text"></i></span>
					<textarea name="descripcion" class="form-control" rows="4" 
						placeholder="Describe the clinical area and scope..." 
						required>{{ v_desc if v_desc else '' }}</textarea>
				</div>
			</div>

			<div class="d-flex justify-content-end mt-4 gap-2">
				<a href="/esMC" class="btn btn-outline-secondary px-4">Cancel</a>
				<button type="submit" class="btn btn-primary px-4">
					<i class="bi bi-check-circle me-1"></i> Save Specialty
				</button>
			</div>
		</form>
	</div>
</div>
{% endblock %}
