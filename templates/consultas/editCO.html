{% extends "base.html" %}
{% block title %}Editar Consulta - MediApp{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center mb-4">
	<div>
		<h3 class="m-0"><strong>Editar Consulta</strong></h3>
		<span class="text-muted">Actualice los datos del registro clínico</span>
	</div>
	<a href="/coMC" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
</div>

<div class="card shadow-sm border-0 rounded-4">
	<div class="card-body p-4">
		{% if error %}
		<div class="alert alert-danger alert-dismissible fade show">
			<i class="bi bi-exclamation-octagon-fill me-2"></i> {{ error }}
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		{% endif %}

		<form method="POST">
			<div class="mb-3">
				<label class="form-label fw-bold">Paciente</label>
				<select name="id_paciente" class="form-select" required>
					<option value="" disabled>-- Seleccionar paciente --</option>
					{% for p in pacientes %}
					<option value="{{ p.id_paciente }}" {% if p.id_paciente==user.id_paciente %}selected{% endif %}>
						{{ p.nombre }}
					</option>
					{% endfor %}
				</select>
			</div>

			<div class="mb-3">
				<label class="form-label fw-bold">Fecha y Hora</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
					<input type="datetime-local" name="fecha" class="form-control" value="{{ user.fecha }}" required>
				</div>
			</div>

			<div class="mb-3">
				<label class="form-label fw-bold">Plan de Tratamiento</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-capsule"></i></span>
					<textarea name="tratamiento" class="form-control" rows="2" required>{{ user.tratamiento }}</textarea>
				</div>
			</div>

			<div class="mb-4">
				<label class="form-label fw-bold">Diagnóstico</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-clipboard2-pulse"></i></span>
					<textarea name="diagnostico" class="form-control" rows="3" required>{{ user.diagnostico }}</textarea>
				</div>
			</div>

			<div class="d-flex justify-content-end mt-4 gap-2">
				<a href="/coMC" class="btn btn-outline-secondary px-4">Cancelar</a>
				<button type="submit" class="btn btn-primary px-4">
					<i class="bi bi-save me-1"></i> Guardar Cambios
				</button>
			</div>
		</form>
	</div>
</div>
{% endblock %}
