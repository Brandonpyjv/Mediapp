{% extends "base.html" %}
{% block title %}Add Consultation - MediApp{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center mb-4">
	<div>
		<h3 class="m-0"><strong>Record New Consultation</strong></h3>
		<span class="text-muted">Register patient assessment and diagnosis</span>
	</div>
	<a href="/coMC" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Return</a>
</div>

<div class="card shadow-sm border-0 rounded-4">
	<div class="card-body p-4">
		{% if error %}
		<div class="alert alert-danger alert-dismissible fade show">
			<i class="bi bi-exclamation-octagon-fill me-2"></i> {{ error }}
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		{% endif %}

		<form action="/addCO" method="POST">
			<div class="mb-3">
				<label class="form-label fw-bold">Consultation Date & Time</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
					<input type="datetime-local" class="form-control" name="fecha"
						value="{{ v_fecha if v_fecha else '' }}" required>
				</div>
			</div>

			<div class="row">
				<div class="col-md-6 mb-3">
					<div class="bg-light p-3 rounded-3 border">
						<label class="form-label text-primary fw-bold mb-2"><i class="bi bi-search"></i> Select Patient</label>
						<input type="text" id="buscarPaciente" class="form-control mb-2" placeholder="Filter patient...">
						<select class="form-select" name="id_paciente" id="selectPaciente" required>
							<option value="" disabled {{ 'selected' if not v_id_pac else '' }}>-- Choose Patient --</option>
							{% for p in pacientes %}
							<option value="{{ p.id_paciente }}" {{ 'selected' if v_id_pac|string==p.id_paciente|string else '' }}>
								{{ p.nombre }}
							</option>
							{% endfor %}
						</select>
					</div>
				</div>

				<div class="col-md-6 mb-3">
					<div class="bg-light p-3 rounded-3 border">
						<label class="form-label text-primary fw-bold mb-2"><i class="bi bi-search"></i> Select Doctor</label>
						<input type="text" id="buscarMedico" class="form-control mb-2" placeholder="Filter doctor...">
						<select class="form-select" name="id_medico" id="selectMedico" required>
							<option value="" disabled {{ 'selected' if not v_id_med else '' }}>-- Choose Doctor --</option>
							{% for m in medicos %}
							<option value="{{ m.id_medico }}" {{ 'selected' if v_id_med|string==m.id_medico|string else '' }}>
								{{ m.nombre }}
							</option>
							{% endfor %}
						</select>
					</div>
				</div>
			</div>

			<div class="mb-3">
				<label class="form-label fw-bold">Treatment Plan</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-capsule"></i></span>
					<textarea class="form-control" name="tratamiento" rows="2"
						placeholder="Describe the treatment..."
						required>{{ v_tratamiento if v_tratamiento else '' }}</textarea>
				</div>
			</div>

			<div class="mb-3">
				<label class="form-label fw-bold">Diagnosis</label>
				<div class="input-group">
					<span class="input-group-text"><i class="bi bi-clipboard2-pulse"></i></span>
					<textarea class="form-control" name="diagnostico" rows="3"
						placeholder="Final medical diagnosis..."
						required>{{ v_diagnostico if v_diagnostico else '' }}</textarea>
				</div>
			</div>

			<div class="d-flex justify-content-end mt-4 gap-2">
				<a href="/coMC" class="btn btn-outline-secondary px-4">Cancel</a>
				<button type="submit" class="btn btn-primary px-4">
					<i class="bi bi-save me-1"></i> Save Consultation
				</button>
			</div>
		</form>
	</div>
</div>

<script>
	function aplicarFiltro(inputId, selectId) {
		document.getElementById(inputId).addEventListener("keyup", function () {
			let filtro = this.value.toLowerCase();
			let opciones = document.querySelectorAll("#" + selectId + " option");
			opciones.forEach(op => {
				if (op.value === "") return;
				op.style.display = op.textContent.toLowerCase().includes(filtro) ? "block" : "none";
			});
		});
	}
	aplicarFiltro("buscarPaciente", "selectPaciente");
	aplicarFiltro("buscarMedico", "selectMedico");
</script>
{% endblock %}
